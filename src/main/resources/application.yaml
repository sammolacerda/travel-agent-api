server:
  port: 8080

spring:
  application:
    name: travel-agent-api
  datasource:
    url: jdbc:h2:file:./data/travel-agent-db;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

travel:

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:gpt-oss:20b}
      temperature: ${OLLAMA_TEMPERATURE:0.2}
      timeout: ${OLLAMA_TIMEOUT:120s}

    langchain4j:
      log-requests: true
      log-responses: true

  mcp:
    command: java
    jar: ../travel-mcp-server/target/travel-mcp-server-0.0.1.jar